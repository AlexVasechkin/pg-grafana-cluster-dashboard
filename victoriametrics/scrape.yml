# Scrape-конфиг для VictoriaMetrics (single-node, -promscrape.config).
# Метка pg_cluster задаётся здесь как target-label — так метки кластера живут
# в конфиге сбора, а не в SQL экспортёра.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          pg_cluster: shop-cluster
